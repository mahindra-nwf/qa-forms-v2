<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant QA Forms</title>
<style>
  :root {
    --bg: #eef2f5; --card: #fff; --ink: #14212b; --muted: #5d6b76; --line: #d8e0e6;
    --accent: #0e6b86; --accent-soft: #e3f1f5; --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: baseline; gap: 10px; }
  header a { color: inherit; text-decoration: none; font-weight: 700; font-size: 18px; }
  header small { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
  main { padding: 16px 20px 40px; }
  h1 { font-size: 24px; margin: 4px 0 16px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
  .crumb { color: var(--accent); text-decoration: none; font-size: 14px; }
  .list { display: grid; gap: 8px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
  a.row:hover { border-color: var(--accent); }
  .icon { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .count.zero { color: var(--danger); }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: 0; background: none; color: var(--danger); padding: 6px 8px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 20px; color: var(--muted); text-align: center; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .toggle button { border: 0; border-radius: 0; padding: 6px 12px; color: var(--muted); }
  .toggle button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; color: inherit; text-decoration: none; display: flex; flex-direction: column; }
  a.card:hover { border-color: var(--accent); }
  .card .brand { font: 11px ui-monospace, Consolas, monospace; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  .card .name { font-size: 20px; font-weight: 700; margin: 8px 0 6px; line-height: 1.2; }
  .card .sub { line-height: 1.6; }
  .card .foot { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; color: var(--muted); font-size: 14px; }
  .sheet { display: grid; gap: 12px; }
  .sheet section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px 16px; }
  .fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); align-content: start; }
  input, select, textarea { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { width: auto; }
  .tablewrap { overflow-x: auto; }
  .sheet-table { border-collapse: collapse; width: 100%; min-width: 720px; }
  .sheet-table th, .sheet-table td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
  .sheet-table thead th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sheet-table tbody th { font-weight: 600; white-space: nowrap; width: 1%; padding-right: 14px; }
  .sheet-table tbody th.wrap { white-space: normal; width: auto; }
  /* long descriptions under a row name wrap instead of pushing the table wider than the iPad */
  .sheet-table tr.grouphead th { text-align: center; color: var(--ink); border-bottom: 2px solid var(--line); }
  .sheet-table tr.grouphead th:not(:empty) { background: var(--accent-soft); border-left: 2px solid var(--card); }
  .sheet-table.info { min-width: 0; font-size: 14px; }
  .side { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.5fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .side { grid-template-columns: 1fr; } }
  .note { font-size: 14px; line-height: 1.6; }
  .sidecol { display: grid; gap: 10px; align-content: start; }
  .sheet-table.info.strong { font-size: 17px; font-weight: 700; border: 2px solid var(--ink); }
  .sheet-table.info.strong thead th { font-size: 16px; font-weight: 700; }
  .note > div:first-child { margin-bottom: 8px; }
  .docfoot { margin-top: 18px; font-size: 11px; line-height: 1.5; color: var(--muted); text-align: center; }
  .docfoot div:first-child { font-style: italic; font-weight: 600; }
  .sheet-table.paper td { padding: 5px 3px; }
  .sheet-table.paper input { padding: 7px 4px; font-size: 15px; }
  .sheet-table.paper input[type=number] { min-width: 58px; text-align: center; }
  .sheet-table.paper input[type=date] { width: 136px; }
  .sheet-table.paper .delrow { padding: 6px 6px; }
  .sheet-table.info th, .sheet-table.info td { border: 1px solid var(--line); padding: 5px 8px; text-align: center; white-space: nowrap; }
  .sheet-table.info td:first-child { white-space: normal; }
  .sheet-table.info thead th { color: var(--ink); background: var(--accent-soft); text-transform: none; letter-spacing: 0; font-size: 13px; white-space: normal; }
  .sheet-table tbody th .sub { white-space: normal; min-width: 200px; max-width: 340px; }
  .sheet-table td:nth-child(2) { min-width: 160px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg input { display: none; }
  .seg span { display: block; padding: 6px 12px; cursor: pointer; }
  .seg input:checked + span { background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .sheet section { min-width: 0; }
  .sheet section > * + * { margin-top: 12px; }
  .rowcards { display: grid; gap: 8px; }
  .rowcard { display: flex; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fafcfd; }
  .rowcard .num { color: var(--muted); font-weight: 600; padding-top: 22px; min-width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rowcard .num .delrow { margin-top: 6px; }
  .rowtag { margin-top: 4px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 4px; }
  .rowcard[data-rowtype="label"] { background: #fff; border-style: dashed; }
  .rowcard[data-rowtype="label"] .rowtag { color: #8a5a00; background: #fdf1dc; }
  .delrow { border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; line-height: 1; padding: 8px 10px; min-height: 34px; border-radius: 6px; white-space: nowrap; align-self: center; }
  .delrow:hover, .delrow:active { color: var(--danger); border-color: var(--danger); }
  .delrow.armed { color: #fff; background: var(--danger); border-color: var(--danger); font-weight: 600; }
  .sheet-table td.del { width: 1%; padding: 0; }
  .addrows { display: flex; gap: 8px; flex-wrap: wrap; }
  .photo-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 10px 16px; cursor: pointer; min-height: 44px; }
  h2.later { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); }
  h3.brand { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
  .sheethead { margin-bottom: 14px; }
  .sheethead h1 { margin: 6px 0 4px; line-height: 1.25; }
  .sheethead .meta { color: var(--muted); font-size: 14px; }
  .logcode { display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 4px; padding: 1px 7px; margin-right: 8px; }
  .sheethead .desc { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; }
  .cardbody { flex: 1; min-width: 0; display: grid; gap: 8px; }
  .cardbody .cardgrid { flex: none; }
  .cgroup + .cgroup { border-top: 1px dashed var(--line); padding-top: 8px; }
  .cgtitle { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .clusters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .cluster { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 8px; background: #fff; min-width: 0; }
  .cltitle { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 18, .92); display: grid; place-items: center; padding: 56px 16px 16px; }
  .viewer img { max-width: calc(100vw - 32px); max-height: calc(100vh - 72px); object-fit: contain; border-radius: 4px; }
  .viewer button { position: absolute; top: 12px; right: 12px; background: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
  .doc img, .photo-cell img, .photo-grid img { cursor: zoom-in; }
  .docs { display: grid; gap: 6px; }
  .doc-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .doc-list:empty { display: none; }
  .doc { display: grid; gap: 4px; width: 120px; }
  .doc img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .doc select { padding: 4px 6px; font-size: 13px; }
  .doc .delrow { justify-self: start; }
  .doc-add { display: flex; gap: 8px; flex-wrap: wrap; }
  .doc-add .photo-btn { padding: 6px 12px; min-height: 36px; color: var(--accent); }
  /* big upload boxes (Receiving Documents): two dashed tiles side by side */
  .doc-add.big { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; order: -1; }
  .doc-add.big .photo-btn { justify-content: center; min-height: 140px; border: 2px dashed var(--accent); background: transparent; font-weight: 600; font-size: 18px; }
  .photo-cell { display: flex; align-items: center; gap: 6px; }
  .photo-cell .photo-btn { padding: 6px 12px; min-height: 36px; color: var(--accent); white-space: nowrap; }
  .photo-cell img { height: 36px; width: 48px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  .photo-cell .delrow { padding: 6px 8px; min-height: 32px; }
  .photo-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .photo-grid:empty { display: none; }
  .photo { position: relative; margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fafcfd; }
  .photo img { display: block; width: 100%; height: 150px; object-fit: cover; }
  .photo figcaption { font-size: 12px; color: var(--muted); padding: 4px 8px; }
  .photo .delrow { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,.95); }
  .cardgrid { flex: 1; min-width: 0; display: grid; gap: 8px 10px; grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr)); }
  .cardgrid .field span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cardgrid .seg { display: flex; }
  .cardgrid .seg label { flex: 1; text-align: center; }
  .cardgrid .seg span { font-size: 14px; color: var(--ink); padding: 7px 4px; overflow: visible; }
  .cardgrid .check { padding-top: 7px; }
  @media (max-width: 900px) { .cardgrid { grid-template-columns: repeat(var(--cols-narrow, 5), minmax(0, 1fr)); } }
  .hint { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
  .caption { font-weight: 600; margin-bottom: 4px; }
  .check { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink); }
  .unit { display: flex; align-items: center; gap: 4px; }
  .unit > span { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .unit input { flex: 1; min-width: 0; }
  /* In a side-by-side field grid, long checkbox sentences wrap instead of running into the next field. */
  .fields .check { white-space: normal; align-items: flex-start; }
  .fields .check input { margin-top: 3px; }
  .sheet-table td.num { color: var(--muted); width: 1%; }
  .addrow { margin-top: 8px; color: var(--accent); }
  .matrix tbody th { white-space: normal; width: auto; font-weight: 400; min-width: 320px; }
  @media (max-width: 900px) { .matrix tbody th { min-width: 260px; } } /* portrait iPad: SSOP 056-A fits without sideways scrolling */
  .matrix td { text-align: center; width: 120px; }
  .matrix .reading { margin-top: 6px; max-width: 200px; }
  .tick { width: 56px; height: 40px; font-size: 20px; font-weight: 700; color: var(--accent); padding: 0; }
  .tick.flag { color: var(--danger); background: #fdecea; border-color: #f2b8b5; }
  .matrix .initials th { font-weight: 600; }
  .matrix .initials input { width: 70px; text-align: center; text-transform: uppercase; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20, 33, 43, .35); }
  dialog .head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  dialog .body { padding: 12px 16px; max-height: 60vh; overflow: auto; display: grid; gap: 6px; }
  dialog .row { cursor: pointer; width: 100%; text-align: left; }
  dialog .row:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><a href="#">Plant QA Forms</a><small>Regions</small></header>
<main id="app"></main>

<dialog id="picker">
  <div class="head"><strong>Add a log sheet</strong><button onclick="picker.close()">Close</button></div>
  <div class="body" id="pickerList"></div>
</dialog>

<script>
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const folderIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const sheetIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>';
// build-static.js flips this to true for the GitHub Pages demo: data comes from saved .json files
// next to the page, and adding or removing log sheets is turned off.
const STATIC = false;
if (STATIC) document.querySelector('header small').textContent = 'Demo · read-only';
const api = async (url, opts) => {
  if (STATIC) url = url.slice(1) + (url.endsWith('.json') ? '' : '.json');
  // no-cache: always check for a newer copy, so edits show up right after a deploy
  const r = await fetch(url, { cache: 'no-cache', ...opts }); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; };
const productUrl = p => p.plant ? '/api/plant/sheets' : `/api/products/${encodeURIComponent(p.brand)}/${encodeURIComponent(p.folder)}/sheets`;
let products = [], plant;

async function render() {
  const parts = location.hash.slice(1).split('/').filter(Boolean).map(decodeURIComponent);
  if (parts[0] === 'r') return showRegionRoute(parts.slice(1));
  if (!parts.length) return showHome();
  [products, plant] = await Promise.all([api('/api/products'), api('/api/plant')]);
  plant.plant = true;
  const [p, file] = parts[0] === 'plant' ? [plant, parts[1]]
    : [products.find(p => p.brand === parts[0] && p.folder === parts[1]), parts[2]];
  if (!p) return showFolders();
  file && p.sheets.some(s => s.file === file) ? showSheet(p, file) : showProduct(p);
}

// ---- Regions ----
// Each iPad can be set to one region (it then opens straight there) or to all regions.
// Switching between "one iPad per region" and "one iPad per worker" is only this setting.
let deviceRegion = '';
try { deviceRegion = localStorage.getItem('region') || ''; } catch {}
const setDeviceRegion = r => { deviceRegion = r; try { localStorage.setItem('region', r); } catch {} };
const enc = encodeURIComponent;
const regionHref = r => `#r/${enc(r.id)}`;
const regionProductHref = (r, p) => `${regionHref(r)}/p/${enc(p.folder)}`;
const logCount = n => n + ' log' + (n === 1 ? '' : 's');

async function showHome() {
  const regions = await api('/api/regions');
  const mine = regions.find(r => r.id === deviceRegion);
  if (mine) return showRegion(await api(`/api/regions/${enc(mine.id)}`));
  app.innerHTML = `
    <h1>Regions</h1>
    <div class="list">${regions.map(r => `
      <a class="row" href="${regionHref(r)}">
        <span class="icon">${folderIcon}</span>
        <span class="grow"><div class="title">${esc(r.name)}${r.title ? ' · ' + esc(r.title) : ''}</div>
          <div class="sub">${r.products ? r.products + ' products · ' : ''}${logCount(r.logs.filter(l => l.scope === 'line').length)}${r.products ? ' for the whole line' : ''}</div></span>
      </a>`).join('')}
    </div>
    ${regions.length ? '' : '<div class="empty">No regions yet. Add folders under <code>regions/</code>.</div>'}
    <h2>Not in a region yet</h2>
    <div class="list"><a class="row" href="#products">
      <span class="icon">${folderIcon}</span>
      <span class="grow"><div class="title">Earlier product folders</div><div class="sub">Plant-wide sheets (SSOP, receiving, shipping)</div></span>
    </a></div>`;
}

async function showRegionRoute([id, kind, a, b]) {
  const r = await api(`/api/regions/${enc(id)}`);
  const lineLog = kind === 'log' && r.logs.find(l => l.file === a && l.scope === 'line');
  if (lineLog) return lineLog.group
    ? renderSheet(`/api/regions/${enc(r.id)}/logs/${enc(a)}`, `${regionHref(r)}/group/${enc(lineLog.group)}`, `${r.name} · ${lineLog.group}`)
    : renderSheet(`/api/regions/${enc(r.id)}/logs/${enc(a)}`, regionHref(r), r.name);
  const p = kind === 'p' && r.products.find(p => p.folder === a);
  if (p && b && r.logs.some(l => l.file === b && l.scope === 'product'))
    return renderSheet(`/api/regions/${enc(r.id)}/products/${enc(p.folder)}/logs/${enc(b)}`, regionProductHref(r, p), `${r.name} · ${p.name}`);
  if (p) return showRegionProduct(r, p);
  if (kind === 'group' && r.logs.some(l => l.group === a)) return showLogGroup(r, a);
  const picked = kind === 'pick' && r.logs.find(l => l.file === a && l.scope === 'product');
  if (picked) return showProductPicker(r, picked);
  showRegion(r);
}

// A per-product log opened from an area (e.g. Prep Room → Log 045): choose the product first.
function showProductPicker(r, l) {
  const brands = [...new Set(r.products.map(p => p.brand || ''))];
  app.innerHTML = `
    <a class="crumb" href="${regionHref(r)}">← ${esc(r.name)}</a>
    <div class="sheethead"><h1>${esc(l.name)}</h1><div class="meta"><span class="logcode">${esc(l.code)}</span>Choose the product</div></div>
    ${brands.map(b => `${b ? `<h2>${esc(b)}</h2>` : ''}<div class="list">${r.products.filter(p => (p.brand || '') === b).map(p => `
      <a class="row" href="${regionProductHref(r, p)}/${enc(l.file)}">
        <span class="icon">${folderIcon}</span>
        <span class="grow"><div class="title">${esc(p.name)}</div><div class="sub">${esc(productSub(p))}</div></span>
      </a>`).join('')}</div>`).join('')}`;
}

function deviceBar(r) {
  if (STATIC) return '';
  const here = deviceRegion === r.id;
  return `<div class="sub" style="margin:0 0 12px">${here
    ? `This iPad opens to ${esc(r.name)}. <button class="link" style="color:var(--accent)" id="unpin">Show all regions instead</button>`
    : `<button id="pin">Make ${esc(r.name)} this iPad's region</button>`}</div>`;
}

function wireDeviceBar(r) {
  const pin = document.getElementById('pin'), unpin = document.getElementById('unpin');
  if (pin) pin.onclick = () => { setDeviceRegion(r.id); showRegion(r); };
  if (unpin) unpin.onclick = () => { setDeviceRegion(''); location.hash = ''; showHome(); };
}

const productSub = p => [p.item && 'Item ' + p.item, p.customer].filter(Boolean).join(' · ') || 'Details not filled in yet';

// Opening a log from the region page: whole-line logs open straight away, per-product logs ask for the product.
const regionLogHref = (r, l) => l.scope === 'product' ? `${regionHref(r)}/pick/${enc(l.file)}` : `${regionHref(r)}/log/${enc(l.file)}`;

// Regions with r.areas (the sushi line) list their logs by work area; the others by whole line / product.
function areasHtml(r) {
  const byFile = Object.fromEntries(r.logs.map(l => [l.file, l]));
  const area = a => `<h2>${esc(a.name)}</h2>${a.logs.length
    ? `<div class="list">${a.logs.map(f => byFile[f]).filter(Boolean).map(l => logRow(l, regionLogHref(r, l))).join('')}</div>`
    : '<div class="empty">No logs for this area yet.</div>'}`;
  const now = r.areas.filter(a => !a.later), later = r.areas.filter(a => a.later);
  return now.map(area).join('') + (later.length ? `<h2 class="later">Not production zones · lower priority</h2>${later.map(area).join('')}` : '');
}

function regionProductList(r) {
  const brands = [...new Set(r.products.map(p => p.brand || ''))];
  const row = p => `
      <a class="row" href="${regionProductHref(r, p)}">
        <span class="icon">${folderIcon}</span>
        <span class="grow"><div class="title">${esc(p.name)}${p.unsure ? ' <span class="count zero">· not sure this runs in ' + esc(r.name) + '</span>' : ''}</div><div class="sub">${esc(productSub(p))}</div></span>
      </a>`;
  return brands.map(b => `${b && brands.length > 1 ? `<h3 class="brand">${esc(b)}</h3>` : ''}<div class="list">${r.products.filter(p => (p.brand || '') === b).map(row).join('')}</div>`).join('');
}

// Whole-line logs; sheets sharing a "group" (e.g. the five Log 049 mixing sheets) show as one row.
function lineRows(r, line) {
  const seen = new Set(), rows = [];
  for (const l of [...line].sort((a, b) => !!a.placeholder - !!b.placeholder)) {
    if (!l.group) { rows.push(logRow(l, regionLogHref(r, l))); continue; }
    if (seen.has(l.group)) continue;
    seen.add(l.group);
    const members = line.filter(x => x.group === l.group);
    rows.push(logRow({ name: l.group, code: `${l.code} · ${members.length} sheets` }, `${regionHref(r)}/group/${enc(l.group)}`));
  }
  return rows.join('');
}

function showLogGroup(r, group) {
  const members = r.logs.filter(l => l.group === group).sort((a, b) => a.groupOrder - b.groupOrder);
  app.innerHTML = `
    <a class="crumb" href="${regionHref(r)}">← ${esc(r.name)}</a>
    <div class="sheethead"><h1>${esc(group)}</h1><div class="meta"><span class="logcode">${esc(members[0]?.code || '')}</span>Choose the sheet</div></div>
    <div class="list">${members.map(l => logRow(l, regionLogHref(r, l))).join('')}</div>`;
}

function showRegion(r) {
  const line = r.logs.filter(l => l.scope === 'line'), perProduct = r.logs.filter(l => l.scope === 'product');
  app.innerHTML = `
    ${deviceRegion === r.id ? '' : '<a class="crumb" href="#">← All regions</a>'}
    <div class="bar"><h1>${esc(r.name)}${r.title ? ' · ' + esc(r.title) : ''}</h1></div>
    ${deviceBar(r)}
    ${r.areas ? areasHtml(r) : `<h2>${r.products.length ? 'Whole line · one sheet per day' : 'Logs'}</h2>
    <div class="list">${lineRows(r, line)}</div>`}
    ${r.products.length ? `<h2>Products · ${r.products.length} · ${logCount(perProduct.length)} each</h2>
    ${regionProductList(r)}` : ''}`;
  wireDeviceBar(r);
}

const logRow = (l, href, onProduct) => `
  <a class="row" href="${href}">
    <span class="icon">${sheetIcon}</span>
    <span class="grow"><div class="title">${esc(l.name)}</div><div class="sub">${esc(l.code)}${l.scope === 'product' && !onProduct ? ' · for each product' : ''}</div></span>
    ${l.placeholder ? '<span class="count zero">Not built yet</span>' : ''}
  </a>`;

function showRegionProduct(r, p) {
  const needsTargets = r.logs.some(l => l.scope === 'product' && l.file.includes('064'));
  const missing = [!p.item && 'item number', !p.materials && 'recipe rows', needsTargets && !p.components?.length && 'weight targets'].filter(Boolean);
  app.innerHTML = `
    <a class="crumb" href="${regionHref(r)}">← ${esc(r.name)}</a>
    <div class="bar"><h1>${esc(p.name)}</h1></div>
    <div class="sub" style="margin:-10px 0 8px">${esc(productSub(p))}${p.variety && p.variety !== p.name ? ' · ' + esc(p.variety) : ''}</div>
    ${missing.length ? `<div class="empty" style="text-align:left">Not filled in yet: ${esc(missing.join(', '))}. Those parts of the sheets open with blank or generic rows. Add them in <code>regions/${esc(r.id)}/products/${esc(p.folder)}/product.json</code>.</div>` : ''}
    <h2>Log sheets</h2>
    <div class="list">${r.logs.filter(l => l.scope === 'product').map(l => logRow({ ...l, name: l.nameIf && p[l.nameIf.field] === l.nameIf.value ? l.nameIf.name : l.name }, `${regionProductHref(r, p)}/${enc(l.file)}`, true)).join('')}</div>`;
}

const folderHref = p => p.plant ? '#plant' : productHref(p);

// List or cards; remembered on this device only.
let view = 'list';
try { view = localStorage.getItem('productView') || 'list'; } catch {}
const sheetCount = n => n + ' log sheet' + (n === 1 ? '' : 's');

function showFolders() {
  const toggle = `<a class="crumb" href="#">← Regions</a><div class="bar"><h1>Products</h1><div class="toggle">${['list', 'cards'].map(v =>
    `<button data-view="${v}" class="${v === view ? 'on' : ''}">${v === 'list' ? 'List' : 'Cards'}</button>`).join('')}</div></div>`;
  app.innerHTML = toggle + (view === 'cards' ? productCards() : productList());
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    view = b.dataset.view;
    try { localStorage.setItem('productView', view); } catch {}
    showFolders();
  });
}

const productHref = p => `#${encodeURIComponent(p.brand)}/${encodeURIComponent(p.folder)}`;

function productCards() {
  return `<div class="cards">
    <a class="card" href="#plant">
      <div class="brand">Plant</div>
      <div class="name">${esc(plant.name)}</div>
      <div class="sub">SSOP, receiving, shipping<br>${sheetCount(plant.sheets.length)}</div>
      <div class="foot">No records yet</div>
    </a>${products.map(p => `
    <a class="card" href="${productHref(p)}">
      <div class="brand">${esc(p.brand)}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="sub">${esc(p.pack)}<br>${p.item ? 'Item ' + esc(p.item) : 'Item # not set'} · ${sheetCount(p.sheets.length)}</div>
      <div class="foot">No records yet</div>
    </a>`).join('')}</div>`;
}

function productList() {
  const brands = [...new Set(products.map(p => p.brand))];
  return `
    <h2>Plant</h2>
    <div class="list">
      <a class="row" href="#plant">
        <span class="icon">${folderIcon}</span>
        <span class="grow"><div class="title">${esc(plant.name)}</div><div class="sub">SSOP, receiving, shipping</div></span>
        <span class="count ${plant.sheets.length ? '' : 'zero'}">${plant.sheets.length ? sheetCount(plant.sheets.length) : 'No log sheets yet'}</span>
      </a>
    </div>` + brands.map(b => `
    <h2>${esc(b)}</h2>
    <div class="list">${products.filter(p => p.brand === b).map(p => `
      <a class="row" href="${productHref(p)}">
        <span class="icon">${folderIcon}</span>
        <span class="grow"><div class="title">${esc(p.name)}</div><div class="sub">${esc(p.pack)}${p.item ? ' · Item ' + esc(p.item) : ''}</div></span>
        <span class="count ${p.sheets.length ? '' : 'zero'}">${p.sheets.length ? sheetCount(p.sheets.length) : 'No log sheets yet'}</span>
      </a>`).join('')}
    </div>`).join('');
}

function showProduct(p) {
  app.innerHTML = `
    <a class="crumb" href="#products">← Products</a>
    <div class="bar"><h1>${p.plant ? '' : esc(p.brand) + ' · '}${esc(p.name)}</h1>${STATIC ? '' : '<button class="primary" id="add">+ Add log sheet</button>'}</div>
    <div class="sub" style="margin:-10px 0 8px">${p.plant ? esc(p.note) : esc(p.pack) + (p.item ? ' · Item ' + esc(p.item) : '')}</div>
    <h2>Log sheets</h2>
    ${p.sheets.length ? `<div class="list">${p.sheets.map(s => `
      <div class="row">
        <span class="icon">${sheetIcon}</span>
        <a class="grow" href="${folderHref(p)}/${encodeURIComponent(s.file)}" style="color:inherit;text-decoration:none"><div class="title">${esc(s.name)}</div><div class="sub">${esc(s.code)}</div></a>
        ${STATIC ? '' : `<button class="link" data-remove="${esc(s.file)}">Remove</button>`}
      </div>`).join('')}</div>` : `<div class="empty">No log sheets in this folder yet.${STATIC ? '' : ' Tap “Add log sheet” to choose one.'}</div>`}`;
  if (!STATIC) document.getElementById('add').onclick = () => openPicker(p);
  app.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
    if (!confirm(`Remove “${b.closest('.row').querySelector('.title').textContent}” from ${p.name}? The sheet stays in the library.`)) return;
    await api(productUrl(p) + '/' + encodeURIComponent(b.dataset.remove), { method: 'DELETE' });
    render();
  });
}

// One input for a field or table cell. Filling in works; saving comes later.
// `preset` is a value filled in from the product (table cells); otherwise the field's default.
function input(f, name, preset) {
  const n = `name="${esc(name)}"`;
  const value = preset ?? (f.default === 'today' ? new Date().toLocaleDateString('en-CA') : f.default);
  if (f.type === 'select') return `<select ${n}><option></option>${f.options.map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  if (f.type === 'passfail') return `<span class="seg">${(f.options || ['Pass', 'Fail']).map(o =>
    `<label><input type="radio" ${n} value="${esc(o)}"${o === value ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')}</span>`;
  if (f.type === 'textarea') return `<textarea ${n} rows="2">${esc(value || '')}</textarea>`;
  if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" ${n}>${esc(f.checkLabel || '')}</label>`;
  // Several document photos for one row (BOL, invoice…); each photo gets a type (big upload boxes: images only, no type). Files live on the element (el.docs).
  if (f.type === 'photos') return `<div class="docs" data-docs data-name="${esc(name)}" data-types="${f.big ? '' : esc((f.docTypes || ['BOL', 'Invoice', 'Packing slip', 'COA', 'Other']).join('|'))}">
    <div class="doc-list"></div>
    ${f.big ? `<div class="doc-add big"><label class="photo-btn">Upload from device<input type="file" accept="image/*" multiple hidden data-docadd></label>
    <label class="photo-btn">Open camera<input type="file" accept="image/*" capture="environment" hidden data-docadd></label></div></div>` : `<div class="doc-add"><label class="photo-btn">Take photo<input type="file" accept="image/*" capture="environment" hidden data-docadd></label>
    <label class="photo-btn">Choose photo<input type="file" accept="image/*" multiple hidden data-docadd></label></div></div>`}`;
  // One photo taken with the iPad camera (e.g. the label at each label check); taking another replaces it.
  if (f.type === 'photo') return `<span class="photo-cell"><label class="photo-btn"><span>Take photo</span><input type="file" accept="image/*" capture="environment" hidden data-photocell ${n}></label>
    <img alt="" hidden><button type="button" class="delrow" data-clearphoto hidden title="Remove photo">Remove</button></span>`;
  const type = { date: 'date', time: 'time', number: 'number' }[f.type] || 'text';
  const box = `<input type="${type}" ${n}${type === 'number' ? ' inputmode="decimal" step="any"' : ''}${value ? ` value="${esc(value)}"` : ''}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''}>`;
  return f.unit ? `<span class="unit">${box}<span>${esc(f.unit)}</span></span>` : box;
}

const hint = f => f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
const caption = (f, sec) => f.label && f.label !== sec.title ? `<div class="caption">${esc(f.label)}</div>` : '';

// Tables either list fixed rows (one per item) or start with blank rows that "+ Add row" extends.
// A fixed row is a label, or { label, values } when the product fills some cells in.
// Rows the operator adds can be deleted again; fixed rows (one per item) can't.
const delBtn = '<button type="button" class="delrow" data-delrow title="Delete this row">Delete</button>';
const rowNum = i => `<span class="n">${i + 1}</span>`;

function tableRow(f, i, head) {
  // a plain string row has no .sub/.values of its own (careful: strings inherit a built-in .sub())
  const obj = head && typeof head === 'object' ? head : {};
  const label = obj.label ?? head, vals = obj.values || {};
  // a long checklist line (e.g. SSOP 056-B) wraps instead of pushing the table off the screen
  const th = `<th${String(label).length > 50 ? ' class="wrap"' : ''}>${esc(label)}${obj.sub ? `<div class="sub" style="font-weight:400">${esc(obj.sub)}</div>` : ''}</th>`;
  return `<tr>${head !== undefined ? th : `<td class="num">${rowNum(i)}</td>`}${f.columns.map(c =>
    `<td>${input(c, `${f.id}.${i}.${c.id}`, vals[c.id])}</td>`).join('')}${head !== undefined ? '' : `<td class="del">${delBtn}</td>`}</tr>`;
}

// A table can offer several kinds of row (log 060: a full hourly check and a short label check).
// Each entry in f.rowTypes lists the column ids it shows; a type without "columns" shows them all.
const rowType = (f, id) => f.rowTypes?.find(t => t.id === id) || f.rowTypes?.[0];
const columnsFor = (f, t) => t?.columns ? f.columns.filter(c => t.columns.includes(c.id)) : f.columns;

// Too many columns for an iPad-wide table: each row becomes a card. Its boxes are split evenly over
// as few lines as fit (at most 10 slots a line in landscape, 5 in portrait), so no line is left half empty.
// display: "table" keeps a wide table as one line per row, like the paper (e.g. log 051); display: "cards" forces cards
const asCards = f => f.display === 'cards' || (f.display !== 'table' && !f.fixedRows && f.columns.length > 8);
const slotsOf = c => c.span || (c.type === 'passfail' ? 2 : 1);
const perLine = (slots, max) => Math.ceil(slots / Math.ceil(slots / max));
function cardRow(f, i, typeId) {
  const t = rowType(f, typeId);
  // a plain div for the documents box, so tapping a thumbnail doesn't trigger the label's camera input
  const field = (c, short) => { const tag = c.type === 'photos' ? 'div' : 'label';
    // a documents box always takes a whole line (a fixed span wider than a portrait line would squeeze everything else)
    return `<${tag} class="field" style="grid-column: ${c.type === 'photos' ? '1 / -1' : 'span ' + slotsOf(c)}"><span>${esc(short && c.short || c.label)}</span>${input(c, `${f.id}.${i}.${c.id}`)}</${tag}>`; };
  // One grid line; a line in a grouped layout gets one column per slot so it always fills a single line.
  const grid = (cols, opts = {}) => {
    const slots = cols.reduce((n, c) => n + slotsOf(c), 0);
    // lines in a grouped card use at least 10 columns, so boxes keep the same size from line to line
    // instead of a short line stretching a few boxes across the whole card
    const wide = opts.oneLine ? Math.min(Math.max(slots, opts.short ? 0 : 10), 14) : perLine(slots, 10);
    return `<div class="cardgrid" style="--cols:${wide};--cols-narrow:${perLine(slots, opts.oneLine ? 8 : 5)}">${cols.map(c => field(c, opts.short)).join('')}</div>`;
  };
  const col = id => f.columns.find(c => c.id === id);
  // t.layout: the card split into titled lines, one per step; a line can hold "clusters"
  // (e.g. Product 1 / 2 / 3, each with its own weight, O2 and CO2).
  const body = t?.layout
    ? `<div class="cardbody">${t.layout.map(g => `<div class="cgroup"><div class="cgtitle">${esc(g.title)}</div>${g.clusters
        ? `<div class="clusters">${g.clusters.map(cl => `<div class="cluster"><div class="cltitle">${esc(cl.title)}</div>${grid(cl.columns.map(col), { oneLine: true, short: true })}</div>`).join('')}</div>`
        : grid(g.columns.map(col), { oneLine: true })}</div>`).join('')}</div>`
    : grid(columnsFor(f, t), { oneLine: t?.oneLine });
  return `<div class="rowcard"${t ? ` data-rowtype="${esc(t.id)}"` : ''}>
    <div class="num">${rowNum(i)}${t ? `<div class="rowtag">${esc(t.tag || t.label)}</div><input type="hidden" name="${esc(`${f.id}.${i}.rowType`)}" value="${esc(t.id)}">` : ''}${delBtn}</div>
    ${body}</div>`;
}
const rowHtml = (f, i, typeId) => asCards(f) ? cardRow(f, i, typeId) : tableRow(f, i);

function tableHtml(f, sec) {
  const fixed = f.fixedRows, rows = fixed || Array.from({ length: f.rows || 1 });
  const add = fixed ? '' : `<div class="addrows">${(f.rowTypes || [{ label: 'Add row' }]).map(t =>
    `<button type="button" class="addrow" data-addrow="${esc(f.id)}"${t.id ? ` data-rowtype="${esc(t.id)}"` : ''}>+ ${esc(t.label)}</button>`).join('')}</div>`;
  // data-next: index for the next added row, so names stay unique after rows are deleted
  if (asCards(f)) return `${caption(f, sec)}${hint(f)}
    <div class="rowcards" data-table="${esc(f.id)}" data-next="${rows.length}">${rows.map((r, i) => cardRow(f, i)).join('')}</div>${add}`;
  return `${caption(f, sec)}${hint(f)}
    <div class="tablewrap"><table class="sheet-table${f.display === 'table' ? ' paper' : ''}">
      <thead>${groupHead(f)}<tr><th>${esc(fixed ? f.rowHeader || '' : '#')}</th>${labelCells(f)}${fixed ? '' : '<th></th>'}</tr></thead>
      <tbody data-table="${esc(f.id)}" data-next="${rows.length}">${rows.map((r, i) => tableRow(f, i, fixed ? r : undefined)).join('')}</tbody>
    </table></div>${add}`;
}

// Row numbers always count 1, 2, 3… in the order shown, even after a delete.
const renumber = body => body.querySelectorAll(':scope > * .n').forEach((n, i) => n.textContent = i + 1);

// Checklist grid: each box cycles blank → ✓ → ✱ (needs attention) → blank.
function matrixHtml(f, sec) {
  return `${caption(f, sec)}${hint(f)}
    <div class="tablewrap"><table class="sheet-table matrix">
      <thead><tr><th></th>${f.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${f.items.map(it => `<tr>
        <th>${/^[a-z]$/.test(it.id) ? `<b>${it.id}.</b> ` : ''}${esc(it.label)}${it.reading ? `<span class="unit reading"><input type="number" inputmode="decimal" step="any" name="${esc(`${f.id}.${it.id}.reading`)}" placeholder="${esc(it.reading.label)}"><span>${esc(it.reading.unit || '')}</span></span>` : ''}</th>
        ${f.columns.map(c => `<td><button type="button" class="tick" data-name="${esc(`${f.id}.${it.id}.${c.id}`)}"></button></td>`).join('')}</tr>`).join('')}
      ${f.initials ? `<tr class="initials"><th>${esc(f.initials)}</th>${f.columns.map(c => `<td><input name="${esc(`${f.id}.initials.${c.id}`)}" maxlength="4"></td>`).join('')}</tr>` : ''}
      </tbody>
    </table></div>`;
}

// Column names; neighbours marked mergeLabel with the same name share one cell (paper: "F29 Foot Foamer" over 4 and 5).
function labelCells(f) {
  const cells = [];
  for (const c of f.columns) {
    const last = cells[cells.length - 1], text = c.label + (c.unit ? ` (${c.unit})` : '');
    if (last && c.mergeLabel && last.merge && last.text === text) last.span++;
    else cells.push({ text, span: 1, merge: c.mergeLabel });
  }
  return cells.map(c => `<th${c.span > 1 ? ` colspan="${c.span}" style="text-align:center"` : ''}>${esc(c.text)}</th>`).join('');
}

// Column groups: a heading row above the column names (paper: "2. Washroom Hose" over F-364 | F-29).
function groupHead(f) {
  if (!f.columns.some(c => c.group)) return '';
  const cells = [];
  for (const c of f.columns) {
    const last = cells[cells.length - 1];
    if (last && c.group && last.group === c.group) last.span++; else cells.push({ group: c.group || '', span: 1 });
  }
  return `<tr class="grouphead"><th></th>${cells.map(g => `<th colspan="${g.span}">${esc(g.group)}</th>`).join('')}${f.fixedRows ? '' : '<th></th>'}</tr>`;
}

// Read-only reference table printed on the paper (e.g. chemical, units, acceptable range).
// f.title: a heading across the whole box; f.strong: bold, larger text (a boxed limit like the paper's)
const infoHtml = (f, sec) => `${caption(f, sec)}<div class="tablewrap"><table class="sheet-table info${f.strong ? ' strong' : ''}"><thead>${f.title ? `<tr><th colspan="${(f.head || f.body[0]).length}">${esc(f.title)}</th></tr>` : ''}${f.head ? `<tr>${f.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>` : ''}</thead>
  <tbody>${f.body.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

// Printed text from the paper, line by line; a line can be { b: 'bold part', t: 'rest' }.
const noteHtml = f => `<div class="note">${f.lines.map(l => `<div>${typeof l === 'string' ? esc(l) : `<b>${esc(l.b)}</b> ${esc(l.t || '')}`}</div>`).join('')}</div>`;

function fieldHtml(f, sec) {
  if (f.type === 'note') return noteHtml(f);
  if (f.type === 'info') return infoHtml(f, sec);
  if (f.type === 'table') return tableHtml(f, sec);
  if (f.type === 'matrix') return matrixHtml(f, sec);
  // a div for photo boxes, so tapping a thumbnail doesn't open the camera; no heading when the label is empty
  const tag = f.type === 'photos' ? 'div' : 'label';
  return `<${tag} class="field">${f.label ? `<span>${esc(f.label)}${f.required ? ' *' : ''}</span>` : ''}${input(f, f.id)}${hint(f)}</${tag}>`;
}

// Two-tap delete instead of a confirm() pop-up (some browsers block pop-ups, so the button seemed dead):
// the first tap turns Delete into a red "Delete?", the second tap does it; it resets after 5 seconds.
function armed(btn) {
  if (btn.classList.contains('armed')) return true;
  btn.classList.add('armed');
  btn.textContent = 'Delete?';
  setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Delete'; }, 5000);
  return false;
}

// Photo boxes inside rows (rows can be added later, so listen on the page once).
// Tap any photo thumbnail (documents, label photos, paper-log photos) to see it full screen.
// Capture phase + preventDefault so a thumbnail inside a <label> doesn't also open the camera.
document.addEventListener('click', e => {
  const img = e.target.closest('.doc-list img, .photo-cell img, .photo-grid img');
  if (!img) return;
  e.preventDefault();
  e.stopPropagation();
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<img src="${img.src}" alt="${esc(img.alt || 'Photo')}"><button type="button">Close</button>`;
  v.onclick = () => v.remove();          // tap anywhere (or Close) to go back
  document.body.append(v);
}, true);

function drawDocs(box) {
  const types = box.dataset.types.split('|');
  box.querySelectorAll('.doc-list img').forEach(img => URL.revokeObjectURL(img.src));
  box.querySelector('.doc-list').innerHTML = box.docs.map((d, i) => `
    <div class="doc"><img src="${URL.createObjectURL(d.file)}" alt="Document photo ${i + 1}">
      ${types[0] ? `<select data-doctype="${i}" aria-label="Document type">${types.map(t => `<option${t === d.type ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''}
      <button type="button" class="delrow" data-docremove="${i}">Remove</button></div>`).join('');
}
app.addEventListener('change', e => {
  const box = e.target.closest('[data-docs]');
  if (!box) return;
  box.docs = box.docs || [];
  if (e.target.matches('[data-docadd]')) {
    const first = box.dataset.types.split('|')[0];
    box.docs.push(...[...e.target.files].map(file => ({ file, type: first })));
    e.target.value = '';
    drawDocs(box);
  } else if (e.target.matches('[data-doctype]')) box.docs[+e.target.dataset.doctype].type = e.target.value;
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-docremove]');
  if (!b) return;
  const box = b.closest('[data-docs]');
  box.docs.splice(+b.dataset.docremove, 1);
  drawDocs(box);
});

function showCellPhoto(cell, file) {
  const img = cell.querySelector('img'), clear = cell.querySelector('[data-clearphoto]');
  if (img.src) URL.revokeObjectURL(img.src);
  img.hidden = clear.hidden = !file;
  if (file) img.src = URL.createObjectURL(file); else img.removeAttribute('src');
  // with a photo in, the button reads Retake next to the thumbnail
  cell.querySelector('.photo-btn span').textContent = file ? 'Retake' : 'Take photo';
  cell.querySelector('.photo-btn').title = file ? 'Retake photo' : 'Take photo';
}
app.addEventListener('change', e => {
  if (e.target.matches('[data-photocell]')) showCellPhoto(e.target.closest('.photo-cell'), e.target.files[0]);
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-clearphoto]');
  if (!b) return;
  const cell = b.closest('.photo-cell');
  cell.querySelector('input').value = '';
  showCellPhoto(cell, null);
});

function wireSheet(s) {
  app.querySelectorAll('.tick').forEach(b => b.onclick = () => {
    b.textContent = { '': '✓', '✓': '✱' }[b.textContent] || '';
    b.className = 'tick' + (b.textContent === '✱' ? ' flag' : '');
  });
  app.querySelectorAll('[data-addrow]').forEach(b => b.onclick = () => {
    const f = s.sections.flatMap(sec => sec.fields).find(f => f.id === b.dataset.addrow);
    const body = app.querySelector(`[data-table="${CSS.escape(f.id)}"]`);
    const i = Number(body.dataset.next);
    body.dataset.next = i + 1;
    body.insertAdjacentHTML('beforeend', rowHtml(f, i, b.dataset.rowtype));
    renumber(body);
    body.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  app.querySelectorAll('[data-table]').forEach(body => body.addEventListener('click', e => {
    const del = e.target.closest('[data-delrow]');
    if (!del || !armed(del)) return;
    del.closest('.rowcard, tr').remove();
    renumber(body);
  }));
}

const showSheet = (p, file) => renderSheet(productUrl(p) + '/' + encodeURIComponent(file), folderHref(p), p.plant ? p.name : p.brand + ' · ' + p.name);

async function renderSheet(url, backHref, backLabel) {
  const s = await api(url);
  app.innerHTML = `
    <a class="crumb" href="${backHref}">← ${esc(backLabel)}</a>
    <div class="sheethead">
      <h1>${esc(s.name)}</h1>
      <div class="meta"><span class="logcode">${esc(s.code)}</span>${esc(s.frequency || '')}</div>
      ${s.description ? `<p class="desc">${esc(s.description)}</p>` : ''}
    </div>
    ${s.placeholder ? `<div class="empty" style="text-align:left">This log isn't built yet. Send the paper or Excel version of ${esc(s.code)} and it will be added here.</div>` : ''}
    <form class="sheet" onsubmit="return false">${s.sections.map(sec => `
      <section>
        ${sec.title ? `<h2>${esc(sec.title)}</h2>` : ''}
        ${sectionBody(sec)}
      </section>`).join('')}
      ${s.noPaper ? "" : photoSection()}
      <div class="bar"><span class="sub">Preview: entries aren't saved yet.</span><button class="primary" disabled>Save</button></div>
      ${s.footer ? `<footer class="docfoot">${s.footer.map(l => `<div>${esc(l)}</div>`).join('')}</footer>` : ''}
    </form>`;
  wireSheet(s);
  wirePhotos(app.querySelector('form.sheet'));
}

// Every log has a photo section: while the plant is not fully digital, QA photographs the paper
// log as a backup paper trail. "Take photo" opens the iPad camera; "Choose photo" opens the library.
// The pictures are kept on the form (form.photos) for the save step to upload once it exists.
function photoSection() {
  return `<section class="photos-section">
    <h2>Photo of paper log</h2>
    <div class="hint">Take a photo of the filled-in paper log as a backup. You can add more than one.</div>
    <div class="photo-grid" data-photos></div>
    <div class="addrows">
      <label class="addrow photo-btn">Take photo<input type="file" accept="image/*" capture="environment" hidden></label>
      <label class="addrow photo-btn">Choose photo<input type="file" accept="image/*" multiple hidden></label>
    </div>
  </section>`;
}

function wirePhotos(form) {
  const grid = form.querySelector("[data-photos]");
  if (!grid) return; // a log with no paper version (noPaper) has no paper-log photo box
  form.photos = [];
  const draw = () => {
    grid.querySelectorAll('img').forEach(img => URL.revokeObjectURL(img.src));
    grid.innerHTML = form.photos.map((p, i) => `
      <figure class="photo"><img src="${URL.createObjectURL(p.file)}" alt="Photo ${i + 1} of the paper log">
        <figcaption>${esc(p.time)}</figcaption>
        <button type="button" class="delrow" data-delphoto="${i}" title="Remove this photo">Remove</button></figure>`).join('');
  };
  // only the paper-log buttons here; photo boxes inside rows are handled by showCellPhoto
  form.querySelectorAll('.photos-section .photo-btn input').forEach(inp => inp.onchange = () => {
    const time = new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
    form.photos.push(...[...inp.files].map(file => ({ file, time })));
    inp.value = '';
    draw();
  });
  grid.onclick = e => {
    const b = e.target.closest('[data-delphoto]');
    if (!b) return;
    form.photos.splice(Number(b.dataset.delphoto), 1);
    draw();
  };
}

// Simple fields sit side by side in a grid; tables and grids take the full width.
// sec.side: wide items sit side by side (paper: instructions to the left of the reference table)
function sectionBody(sec) {
  if (sec.side) {  // left: notes and boxes stacked; right: reference tables
    const right = f => f.type === 'info' || f.type === 'table';
    return `<div class="side"><div class="sidecol">${sec.fields.filter(f => !right(f)).map(f => fieldHtml(f, sec)).join('')}</div><div class="wide">${sec.fields.filter(right).map(f => fieldHtml(f, sec)).join('')}</div></div>`;
  }
  const wide = f => f.type === 'table' || f.type === 'matrix' || f.type === 'textarea' || f.type === 'info' || f.type === 'note' || f.type === 'photos' || f.wide;
  let html = '', run = [];
  const flush = () => { if (run.length) html += `<div class="fields">${run.map(f => fieldHtml(f, sec)).join('')}</div>`; run = []; };
  for (const f of sec.fields) wide(f) ? (flush(), html += `<div class="wide">${fieldHtml(f, sec)}</div>`) : run.push(f);
  flush();
  return html;
}

async function openPicker(p) {
  const library = await api('/api/library'), have = new Set(p.sheets.map(s => s.file));
  pickerList.innerHTML = library.map(s => `
    <button class="row" data-file="${esc(s.file)}" ${have.has(s.file) ? 'disabled' : ''}>
      <span class="icon">${sheetIcon}</span>
      <span class="grow"><div class="title">${esc(s.name)}</div><div class="sub">${esc(s.code)}${have.has(s.file) ? ' · already added' : ''}</div></span>
    </button>`).join('');
  pickerList.querySelectorAll('[data-file]').forEach(b => b.onclick = async () => {
    await api(productUrl(p), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: b.dataset.file }) });
    picker.close();
    render();
  });
  picker.showModal();
}

addEventListener('hashchange', render);
render().catch(e => app.innerHTML = `<div class="empty">Couldn't load products: ${esc(e.message)}</div>`);
</script>
</body>
</html>
